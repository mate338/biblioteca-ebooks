<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dreamer Library</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🔥 FUNDO ANIMADO -->
  <div class="energia-bg"></div>

  <div id="notificacaoCompra" class="notificacao-compra"></div>

  <!-- HEADER -->
  <header>
    <h1 id="titulo">
      <span class="icone">📚</span>
      <span id="texto-titulo"></span>
    </h1>

  </header>

  <!-- GRID DE EBOOKS -->
  <section class="grid" id="ebooks"></section>

  <!-- 💰 PARCERIA / WHATSAPP -->
  <footer class="footer-parceria">
    <h2>Quer divulgar seu ebook aqui?</h2>
    <p>Entre em contato para parcerias e publicação de materiais digitais.</p>

    <a href="https://wa.me/5591993303430" target="_blank" class="btn-whatsapp">
      Falar no WhatsApp
    </a>
  </footer>
  
  <div id="modal" class="modal">
  <div class="modal-content">
    <span id="fecharModal" class="fechar">&times;</span>
    <img id="modalImagem" src="" alt="">
    <h2 id="modalTitulo"></h2>
    <p id="modalDescricao"></p>
    <strong id="modalPreco"></strong>
    <a id="modalLink" href="#" target="_blank">Comprar agora</a>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
