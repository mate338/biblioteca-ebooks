<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dreamer Store</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff00cc">

  <!-- Meta Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)

      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :

      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;

    fbq('init', '4388246058103303');

<body>

  <!-- Meta Pixel NoScript -->
  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=4388246058103303&ev=PageView&noscript=1"

  <!-- 🔥 FUNDO ANIMADO -->
  <div class="energia-bg"></div>

  <!-- 🔔 NOTIFICAÇÃO DE COMPRA -->
  <div id="notificacaoCompra" class="notificacao-compra"></div>

  <!-- HEADER -->
  <header>

    <h1 id="titulo">
      <span class="icone">📚</span>
      <span id="texto-titulo"></span>
    </h1>

    <!-- CATEGORIAS PRINCIPAIS -->
    <div class="categorias">
      <button class="categoria-btn ativo" data-categoria="todos">Todos</button>
      <button class="categoria-btn" data-categoria="ebooks">📚 Ebooks</button>
      <button class="categoria-btn" data-categoria="fisicos">📦 Produtos Físicos</button>
      <button class="categoria-btn" data-categoria="servicos">🛠️ Serviços</button>
    </div>

    <!-- CONTADORES -->
    <div class="contadores-produtos">

      <div class="contador-item">
        📚 <span id="totalEbooks">0</span> ebooks
      </div>

      <div class="contador-item">
        📦 <span id="totalFisicos">0</span> físicos
      </div>

      <div class="contador-item">
        🛠️ <span id="totalServicos">0</span> serviços
      </div>

    </div>

  </header>

  <!-- GRID DE PRODUTOS -->
  <section class="grid" id="ebooks"></section>

  <h2 class="titulo-carrossel">
    🔥 MAIS PROCURADOS DA SEMANA 🔥
  </h2>

  <div class="carrossel-container">
    <div class="carrossel" id="carrosselDestaque"></div>
  </div>

  <!-- MODAL DE PREVIEW -->
  <div id="modal" class="modal">

    <div class="modal-content">

      <span id="fecharModal" class="fechar">&times;</span>

      <button id="btnCompartilharModal" class="btn-compartilhar-modal">
        🔗 Compartilhar
      </button>

      <img id="modalImagem" src="" alt="Imagem do produto">

      <h2 id="modalTitulo"></h2>

      <p id="modalDescricao"></p>

      <strong id="modalPreco"></strong>

      <a id="modalLink" href="#" target="_blank">
        Comprar agora
      </a>

    </div>

  </div>

  <div class="carrossel-container">

    <div class="carrossel" id="carrosselDestaque">

      <div class="carrossel-card">
        <img src="imagens/fisico-elefantol13.jpg" alt="">
      </div>

      <div class="carrossel-card">

      </div>

      <div class="carrossel-card">
        <img src="imagens/fisico-mounjax3.jpg" alt="">
      </div>

      <div class="carrossel-card">
        <img src="imagens/fisico-colageno5.jpg" alt="">
      </div>

      <div class="carrossel-card">
        <img src="imagens/servico-tv01.jpg" alt="">

      <div class="carrossel-card">
        <img src="imagens/imagens-ebook22.jpg" alt="">

      <div class="carrossel-card">
        <img src="imagens/imagens-ebook3.jpg" alt="">

      <div class="carrossel-card">

      <div class="carrossel-card">

      <div class="carrossel-card">
