<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dreamer Store</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff00cc">
</head>

<body>

  <!-- 🔥 FUNDO ANIMADO -->
  <div class="energia-bg"></div>

  <!-- 🔔 NOTIFICAÇÃO DE COMPRA -->
  <div id="notificacaoCompra" class="notificacao-compra"></div>

  <!-- HEADER -->
  <header>

    <h1 id="titulo">
      <span class="icone">📚</span>
      <span id="texto-titulo"></span>
    </h1>

    <!-- CATEGORIAS PRINCIPAIS -->
    <div class="categorias">
      <button class="categoria-btn ativo" data-categoria="todos">Todos</button>
      <button class="categoria-btn" data-categoria="ebooks">📚 Ebooks</button>
      <button class="categoria-btn" data-categoria="fisicos">📦 Produtos Físicos</button>
      <button class="categoria-btn" data-categoria="servicos">🛠️ Serviços</button>
    </div>

    <!-- CONTADORES -->
    <div class="contadores-produtos">

      <div class="contador-item">
        📚 <span id="totalEbooks">0</span> ebooks
      </div>

      <div class="contador-item">
        📦 <span id="totalFisicos">0</span> físicos
      </div>

      <div class="contador-item">
        🛠️ <span id="totalServicos">0</span> serviços
      </div>

    </div>

  </header>

  <!-- GRID DE PRODUTOS -->
  <section class="grid" id="ebooks"></section>

  <!-- MODAL DE PREVIEW -->
  <div id="modal" class="modal">
    <div class="modal-content">

      <span id="fecharModal" class="fechar">&times;</span>

      <button id="btnCompartilharModal" class="btn-compartilhar-modal">
        🔗 Compartilhar
      </button>

      <img id="modalImagem" src="" alt="Imagem do produto">

      <h2 id="modalTitulo"></h2>

      <p id="modalDescricao"></p>

      <strong id="modalPreco"></strong>

      <a id="modalLink" href="#" target="_blank">
        Comprar agora
      </a>

    </div>
  </div>

  <!-- 💰 PARCERIA / WHATSAPP -->
  <footer class="footer-parceria">
    <h2>Quer divulgar seu ebook, produto ou serviço aqui?</h2>
    <p>Entre em contato para parcerias e publicação na Dreamer Store.</p>

    <a href="https://wa.me/5591992682656" target="_blank" class="btn-whatsapp">
      Falar no WhatsApp
    </a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
