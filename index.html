<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamer Store</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- 🔥 FUNDO ANIMADO -->
  <div class="energia-bg"></div>

  <div id="notificacaoCompra" class="notificacao-compra"></div>


  <!-- HEADER -->
<header>

  <h1 id="titulo">
    <span class="icone">📚</span>
    <span id="texto-titulo"></span>
  </h1>

  <div class="categorias">
  <button class="categoria-btn ativo" data-categoria="todos">Todos</button>
  <button class="categoria-btn" data-categoria="ebooks">📚 Ebooks</button>
  <button class="categoria-btn" data-categoria="fisicos">📦 Produtos Físicos</button>
</div>

<div class="top-bar">
    <div class="busca-box">
      <span class="icone-busca">🔍</span>
      <input type="text" id="pesquisa" placeholder="Buscar ebook...">
    </div>

    <div class="contadores-produtos">
  <div class="contador-item">
    📚 <span id="totalEbooks">0</span> ebooks
  </div>

  <div class="contador-item">
    📦 <span id="totalFisicos">0</span> físicos
  </div>
</div>

 <select id="filtroCategoria">
      <option value="todos">Todos</option>
      <option value="marketing">Marketing</option>
      <option value="persuasao">Persuasão</option>
      <option value="saude">Saúde</option>
      <option value="relacionamento">Relacionamento</option>
    </select>
  </div>

</header>

  <!-- GRID DE EBOOKS -->
  <section class="grid" id="ebooks"></section>

  <section class="carrossel-section">

  <h2 class="titulo-carrossel">
    🔥 Mais procurados da semana
  </h2>

  <div class="carrossel-container">

    <div class="carrossel" id="carrosselDestaque">

      <div class="card-destaque">
        <img src="imagens/imagens-ebook3.jpg">
        <h3>TECNICAS PROIBIDAS DE PERSUASÃO</h3>
      </div>

      <div class="card-destaque">
        <img src="imagens/imagens-ebook7.jpg">
        <h3>DOMINANDO A IA</h3>
      </div>

      <div class="card-destaque">
        <img src="imagens/imagens-ebook10.jpg">
        <h3>DETOX DOS FAMOSOS</h3>
      </div>

      <div class="card-destaque">
        <img src="imagens/fisico-colageno5.jpg">
        <h3>COLAGENO TIPO 2 PRO</h3>
      </div>

      <div class="card-destaque">
        <img src="imagens/imagens-ebook21.jpg">
        <h3>A REGRA E NÃO TER REGRAS</h3>
      </div>

      <div class="card-destaque">
        <img src="imagens/imagens-ebook22.jpg">
        <h3>A CABEÇA DE STEVE JOBS</h3>
      </div>

      <div class="card-destaque">
        <img src="imagens/imagens-ebook24.jpg">
        <h3>COPYS PODEROSAS</h3>
      </div>

      <div class="card-destaque">
        <img src="imagens/fisico-libidroll2.jpg">
        <h3>LIBIDROLL</h3>
      </div>

    </div>

  </div>

</section>
  
  <div id="modal" class="modal">
  <div class="modal-content">
    <span id="fecharModal" class="fechar">&times;</span>
    <img id="modalImagem" src="" alt="">
    <h2 id="modalTitulo"></h2>
    <p id="modalDescricao"></p>
    <strong id="modalPreco"></strong>
    <a id="modalLink" href="#" target="_blank">Comprar agora</a>
  </div>
</div>

  <script src="script.js"></script>
</body>
</html>
